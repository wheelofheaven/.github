name: Content Issue
description: Report incorrect, missing, or unclear content
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Help us improve the content!

  - type: input
    id: url
    attributes:
      label: Page URL
      description: Which page has the issue?
      placeholder: https://www.wheelofheaven.world/wiki/elohim/
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Issue type
      options:
        - Typo or grammar
        - Factual error
        - Missing information
        - Unclear explanation
        - Broken link
        - Missing translation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's the issue and how should it be fixed?
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      description: Which language version?
      placeholder: English, Deutsch, etc.
    validations:
      required: false
